# Parámetros del proyecto (unidades en el comentario)
# Los valores marcados BORRADOR son iniciales: se ajustan con la referencia hecha a mano (F1.4).

video:
  target_fps: 10           # cuadros por segundo del video estandarizado (el original es ~60)
  crf: 23                  # calidad H.264 (menor = más calidad y más peso); 23 ≈ 156 MB por 2 min
  select_sharpest: true    # conserva el cuadro más nítido de cada ventana
  delete_raw: false        # conserva el original en videos_raw (por si se necesita luego)
  orientation_min_confidence: 1.2  # por debajo, el giro se fija a mano (columna rotate de videos.csv)

sharpness:
  downscale: 0.5           # factor de reducción antes de medir nitidez (velocidad)
  window: 31               # cuadros de la mediana móvil (A1)
  rel_threshold: 0.7       # BORRADOR: borroso si nitidez < 70 % de la mediana móvil

sample:
  n_frames: 18             # cuadros en el mosaico de muestra

# ---------------- BLOQUE A ----------------
bed:                       # A2 y A3 (BORRADOR, decisión 3)
  scale: 0.25              # reducción para segmentar (1080x1920 -> 270x480)
  blur_sigma: 6            # px reducidos; suavizado de brillo y paralaje
  w_parallax: 0.5          # peso del paralaje frente al brillo (0 = solo brillo)
  min_motion_px: 1.0       # px reducidos; por debajo no se usa paralaje (no hay avance)
  solidity_margin: 0.05    # se prefiere la máscara de solo brillo si es más compacta por este margen
  parallax_max_gap: 5      # si no hay avance, el paralaje se mide contra un cuadro hasta 5 adelante
  score_ema: 0.5           # peso del cuadro actual en el puntaje fusionado (1 = sin fusión)
  prior_tol: 0.06          # fracción del alto: borde a menos de esto de la recta previa (null = sin prior)
  prior_max_age: 5         # cuadros: el prior solo se usa si el último cuadro válido es reciente
  prior_slope_tol_deg: 5   # pendiente de cada borde a +-esto de la del cuadro anterior (null = sin límite)
  allow_partial: true      # si un borde falla, medir con el otro + ancho de referencia
  morph_kernel: 15         # px reducidos; apertura y cierre
  edge_step: 1             # px reducidos entre columnas muestreadas
  search_frac: 0.15        # búsqueda del centro de la cama (fracción del alto)
  ransac_iters: 200
  ransac_tol: 6            # px reducidos (el borde de follaje es irregular)
  min_inlier_frac: 0.35    # mínimo de puntos de borde que caen en la recta
  max_edge_angle_diff_deg: 12  # bordes casi paralelos (la perspectiva los abre un poco)
  max_abs_angle_deg: 30    # la cama cruza el cuadro casi horizontal
  width_frac_range: [0.3, 0.9]  # ancho plausible (fracción del alto reducido)
  foliage_hsv_lo: [33, 50, 30]  # follaje verde (A6), escala OpenCV H 0-180
  foliage_hsv_hi: [85, 255, 200]

operator:                  # A2 complemento: zona del camarógrafo (BORRADOR)
  window: 21               # cuadros por ventana para medir la variación temporal
  step: 10                 # cuadros entre ventanas
  min_freq: 0.85           # estático en >= 85 % de las ventanas
  extend_up_frac: 0.08     # la caja sube 8 % del alto (piernas que se mueven)
  dilate_px: 8             # px reducidos

tracking:                  # A4 (BORRADOR, decisiones 4 y 5)
  median_window: 15        # cuadros
  mad_k: 5                 # atípico si residuo > k·MAD local (filtro de Hampel)
  max_gap: 10              # cuadros (1 s) que se interpolan; más largos quedan inválidos
  savgol_window: 21        # cuadros (impar)
  savgol_order: 2

normalize:                 # A5 (BORRADOR, decisiones 6 y 7)
  bed_width_px: 1080       # W: ancho fijo de la cama -> 1080/135 = 8 px/cm
  bed_width_cm: 135
  margin_frac: 0.3         # margen arriba y abajo (fracción de W): A7 necesita ver la franja entre camas
  parallax_k: 1.0          # PENDIENTE F1.3: escala dosel / escala bordes (1 = sin corrección)
  crf: 20

color:                     # A6 (BORRADOR)
  enabled: true
  smooth_window: 15        # cuadros

qc:                        # A7: metas fijadas ANTES de medir (BORRADOR, a discutir)
  step: 3                  # cada cuántos cuadros se mide el color del follaje
  max_width_cv: 0.05       # desviación / media del ancho re-medido
  max_center_std_frac: 0.03   # desviación del centro / W
  max_angle_std_deg: 2.0
  max_invalid_frac: 0.10   # cuadros inválidos o interpolados
  max_jitter_frac: 0.01    # desviación del dy entre cuadros <= 1 % de W (10.8 px ≈ 1.35 cm)
  # color: la desviación del L del follaje entre cuadros debe bajar después de A6

# ---------------- BLOQUE B ----------------
profiles:                  # B1: un perfil por color de flor. HSV en escala OpenCV (H 0-180, S y V 0-255)
  # Calibrados con los histogramas tono-saturación de las camas de cada color (ver
  # config/decisions.md, decisión 8). hue_ranges admite varios rangos (el rojo da la vuelta).
  orange:                  # 63_39A, 63_40A, 63_41A (durazno, H~22). El rango rojizo (H~16) venía del video duplicado borrado el 24 nov
    hue_ranges: [[5, 28]]
    s_min: 90
    v_min: 130
  yellow:                  # 63_58A, 63_59A; los botones son más verdosos (H > 33)
    hue_ranges: [[22, 34]]
    s_min: 110
    v_min: 150
  red:                     # 63_63A: pétalos coral (S 58-147, V 182-252) con centro rojo oscuro
    hue_ranges: [[0, 12], [168, 180]]
    s_min: 50
    v_min: 150
  pink:                    # 64_45B: pétalos rosa pálido (S 38-93, V 164-253)
    hue_ranges: [[0, 6], [145, 180]]
    s_min: 30
    v_min: 150
    clump_diameter_cm: 2.2   # los racimos se reparten con este diámetro de flor (medido a ojo:
                             # el perfil solo capta pedazos de pétalo; es el perfil más débil)
  white:                   # 63_38B, 63_39B: poca saturación y mucho brillo (el tono no sirve)
    hue_ranges: [[0, 180]]
    s_max: 30                # con 45/195 el follaje plateado de 63_38B pasaba por flor
    v_min: 215

detection:                 # B2
  min_diameter_cm: 1.0     # descarta manchas pequeñas
  max_diameter_cm: 8.0
  peak_min_distance_cm: 1.5   # separación mínima entre centros (watershed); flores de ~2.2 cm
  min_circularity: 0.45    # 4πA/P²: el poste blanco y los tallos son alargados
  max_elongation: 0.25     # componente con eje menor / eje mayor < 0.25 y más largo que una flor = poste o tallo
  open_px: 3
  close_px: 5

counting:                  # B3 (BORRADOR, decisión 9)
  method: line             # line (línea de conteo; medidas de cada flor desde su rastro) o track (solo rastros)
  phase_scale: 0.5         # reducción para correlación de fase
  min_response: 0.03       # correlación de fase menos fiable -> se interpola el desplazamiento
  eps_cm: 2.0              # distancia máxima entre cuadros para la misma flor
  max_missing: 3           # cuadros seguidos que una flor puede no detectarse
  min_obs: 10              # una flor debe verse en >= min_obs cuadros (cada flor cruza ~40); el conteo es estable con 10
  line_min_obs: 3          # un rastro que cruza la línea debe verse en >= 3 cuadros (quita ruido)
  stitch_gap: 8            # cuadros: un rastro que empieza tan poco después de otro...
  stitch_eps_cm: 2.0       # ...y a esta distancia es la misma flor (rastro partido)

cut:                       # B4: cuándo se corta cada flor (aproximación)
  coin_diameter_cm: 2.03   # moneda de 100 COP actual (serie 2012): 20.30 mm, Banco de la República
                           # (la anterior, de 1992, mide 23 mm)
  growth_per_day: 0.10     # SUPUESTO: el diámetro crece 10 % por día (calibrar grabando la misma cama 2 días)
  max_days: 7              # tope de días estimados ("otros días")
  color_mad_k: 1.5         # color "no maduro" = índice < mediana - 1.5·MAD de su propia cama
  # min_cut_ratio (opcional, por perfil): diámetro de corte = moneda x min_cut_ratio (1 por defecto)

results:                   # B5
  bin_m: 1.0               # tramos de la distribución a lo largo de la cama
  mosaic_scale: 0.5        # 4 px/cm en el mosaico
